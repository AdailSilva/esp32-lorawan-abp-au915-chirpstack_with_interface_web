etica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">os_runloop_once() — agenda do LMiC</text><text x="300.0" y="350.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">onEvent(): EV_TXSTART · EV_TXCOMPLETE</text><text x="300.0" y="382.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">do_send(): payload, FPort e ACK</text><text x="300.0" y="414.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">handleDownlink(): reset remoto validado</text><text x="300.0" y="446.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">handleCommands(): aplica a configuração</text><text x="300.0" y="478.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">— só sem TX/RX em andamento —</text><text x="300.0" y="510.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">consolePoll() · botão BOOT 3 s</text><rect x="730.0" y="250.0" width="420.0" height="320.0" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="940.0" y="282.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#d97706" text-anchor="middle" font-weight="700">Core 0 · task node_web</text><text x="940.0" y="318.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">WebServer :80 — /, /status, /config.json</text><text x="940.0" y="350.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">/save · /action · /reboot · /factory · /logs</text><text x="940.0" y="382.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">Wi-Fi Station → Soft AP de emergência</text><text x="940.0" y="414.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">DNSServer (portal cativo) · mDNS .local</text><text x="940.0" y="446.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">login HTTP Basic + logout</text><text x="940.0" y="478.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">valida o formulário e grava na NVS</text><text x="940.0" y="510.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#1e293b" text-anchor="middle" font-weight="normal">nunca chama o LMiC</text><rect x="556.0" y="330.0" width="128.0" height="160.0" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/><text x="620.0" y="362.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5" fill="#9333ea" text-anchor="middle" font-weight="700">node_state</text><text x="620.0" y="390.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="normal">status</text><text x="620.0" y="407.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="normal">← loop</text><text x="620.0" y="424.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#33415