<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-label="Visão da rede: nó, gateway, ChirpStack e aplicação">
<title>Visão da rede: nó, gateway, ChirpStack e aplicação</title>
<rect x="1.0" y="1.0" width="1238.0" height="468.0" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<defs><marker id="a_g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a5f"/></marker><marker id="a_c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker><marker id="a_b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker><marker id="a_o" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker><marker id="a_s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="620.0" y="44.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">Onde o nó entra na rede</text><text x="620.0" y="70.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="normal">Sensor → LoRa AU915 → gateway → ChirpStack → sua aplicação · Wi-Fi só para configurar</text><rect x="60.0" y="120.0" width="220.0" height="112.0" rx="12" fill="#e1f1eb" stroke="#0b7a5f" stroke-width="2"/><text x="170.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Nó ABP</text><text x="170.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">ESP32 + RFM95W</text><text x="170.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">este repositório</text><rect x="370.0" y="120.0" width="220.0" height="112.0" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="480.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Gateway</text><text x="480.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">ESP32_SX1302 (8 canais)</text><text x="480.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">ou qualquer Semtech</text><rect x="680.0" y="120.0" width="220.0" height="112.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="790.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">ChirpStack v4</text><text x="790.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">região au915_1</text><text x="790.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">Kubernetes / OCI</text><rect x="990.0" y="120.0" width="190.0" height="112.0" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1085.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Aplicação</text><text x="1085.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">Java/Spring · Angular</text><text x="1085.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">Dart/Flutter</text><line x1="284" y1="176" x2="366" y2="176" stroke="#0b7a5f" stroke-width="3" marker-end="url(#a_g)" marker-start="url(#a_g)"/><text x="325.0" y="164.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#0b7a5f" text-anchor="middle" font-weight="700">LoRa</text><line x1="594" y1="176" x2="676" y2="176" stroke="#0891b2" stroke-width="3" marker-end="url(#a_c)" marker-start="url(#a_c)"/><text x="635.0" y="164.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0891b2" text-anchor="middle" font-weight="700">UDP/MQTT</text><line x1="904" y1="176" x2="986" y2="176" stroke="#2563eb" stroke-width="3" marker-end="url(#a_b)" marker-start="url(#a_b)"/><text x="945.0" y="164.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">MQTT/API</text><rect x="60.0" y="320.0" width="220.0" height="112.0" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="170.0" y="348.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Celular / notebook</text><text x="170.0" y="374.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">página WEB do nó</text><text x="170.0" y="394.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal">http://&lt;nome&gt;.local/</text><line x1="170" y1="236" x2="170" y2="316" stroke="#16a34a" stroke-width="3" marker-end="url(#a_g)" marker-start="url(#a_g)"/><text x="182.0" y="282.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="start" font-weight="700">Wi-Fi (Station ou Soft AP 192.168.101.101)</text><text x="560.0" y="340.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">•  Uplink: payload da página (texto ou hex) a cada N s na FPort configurada</text><text x="560.0" y="370.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">•  Downlink (Class A): RX1/RX2 depois de cada uplink · reset remoto na FPort configurada</text><text x="560.0" y="400.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="start" font-weight="normal">•  Status ao vivo: FCnt, ACKs, último downlink com RSSI/SNR, próximo envio</text>
</svg>
