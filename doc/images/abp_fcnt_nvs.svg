<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img" aria-label="Persistência do FCnt do ABP na NVS">
<title>Persistência do FCnt do ABP na NVS</title>
<rect x="1.0" y="1.0" width="1238.0" height="428.0" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<defs><marker id="a_g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a5f"/></marker><marker id="a_s" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="a_r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs><text x="620.0" y="44.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="700">FCnt do ABP persistido na NVS</text><text x="620.0" y="70.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#64748b" text-anchor="middle" font-weight="normal">O ChirpStack recusa FCnt repetido ou menor · o nó grava o próximo FCnt depois de cada uplink e antes de qualquer reinício</text><rect x="80.0" y="120.0" width="200.0" height="100.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="180.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Boot</text><text x="180.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">lê lmic/seqnoUp</text><text x="180.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">da NVS (ex.: 48)</text><line x1="283" y1="170" x2="314" y2="170" stroke="#64748b" stroke-width="3" marker-end="url(#a_s)"/><rect x="317.0" y="120.0" width="200.0" height="100.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="417.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">LMIC_setSession()</text><text x="417.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">DevAddr, NwkSKey,</text><text x="417.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">AppSKey e NetID</text><line x1="520" y1="170" x2="551" y2="170" stroke="#64748b" stroke-width="3" marker-end="url(#a_s)"/><rect x="554.0" y="120.0" width="200.0" height="100.0" rx="12" fill="#e1f1eb" stroke="#0b7a5f" stroke-width="2"/><text x="654.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">seqnoUp = 48</text><text x="654.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">depois do setSession</text><text x="654.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">(ele zera o contador)</text><line x1="757" y1="170" x2="788" y2="170" stroke="#64748b" stroke-width="3" marker-end="url(#a_s)"/><rect x="791.0" y="120.0" width="200.0" height="100.0" rx="12" fill="#e1f1eb" stroke="#0b7a5f" stroke-width="2"/><text x="891.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Uplink FCnt 48</text><text x="891.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">EV_TXCOMPLETE</text><text x="891.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">grava 49 na NVS</text><line x1="994" y1="170" x2="1025" y2="170" stroke="#64748b" stroke-width="3" marker-end="url(#a_s)"/><rect x="1028.0" y="120.0" width="200.0" height="100.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="1128.0" y="148.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#0f172a" text-anchor="middle" font-weight="700">Reinício</text><text x="1128.0" y="174.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">reset remoto, página,</text><text x="1128.0" y="194.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="normal">console ou queda</text><path d="M1128.0 224 V270 H180.0 V224" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#a_r)"/><text x="620.0" y="292.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">no próximo boot o nó continua de 49 → ChirpStack aceita ✓</text><text x="80.0" y="340.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#334155" text-anchor="start" font-weight="normal">•  Na página: “Alterar FCnt…” define o próximo valor (e grava na NVS) · mudar o DevAddr volta o FCnt a 0 (dispositivo novo).</text><text x="80.0" y="366.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#334155" text-anchor="start" font-weight="normal">•  Restaurar padrão de fábrica NÃO apaga o FCnt · namespace e chave iguais ao firmware 1.0, então a atualização não perde o contador.</text><text x="80.0" y="392.0" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#334155" text-anchor="start" font-weight="normal">•  Versão 1.0 reiniciava pelo reset remoto antes de gravar e repetia um FCnt já visto; na 1.1 a gravação vem antes do esp_restart().</text>
</svg>
